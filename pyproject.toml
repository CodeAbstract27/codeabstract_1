[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeabstract"
version = "1.0.0"
description = "Privacy-Preserving CLI for Secure LLM Code Consultation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "CodeAbstract Team"}
]
keywords = ["privacy", "llm", "code-abstraction", "ast", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "cryptography>=42.0.5",
    "pygments>=2.17.2",
    "pyperclip>=1.8.2",
    "questionary>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "pytest-playwright>=0.4.4",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.20.0",
]
# Phase 5: the web interface. Flask rather than Streamlit because the
# pipeline needs a request boundary to hang masking and validation off,
# and because a test client can drive it -- see web/app.py.
web = [
    "flask>=3.0.0",
]
gemini = [
    "google-generativeai>=0.4.0",
]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-generativeai>=0.4.0",
]
# core/languages/javascript.py points here (`pip install
# 'codeabstract[javascript]'`) for its error messages -- this extra did not
# actually exist, so following that instruction failed. tree-sitter is the
# parser; the two grammar packages are what give it JS and TS syntax.
javascript = [
    "tree-sitter>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
]
# Phase 2: the Random Forest baseline. The CodeBERT fine-tune the proposal
# also specifies is not implemented -- it is gated on the annotated dataset,
# see docs/UPGRADE_PLAN.md Phase 2.
ml = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]


[project.scripts]
codeabstract = "cli:app"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.package-data]
web = ["templates/*.html", "static/*"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pyright]
include = ["."]
extraPaths = ["."]
